<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Home</title>

  <style>
    /* ===============================
       Base Reset
       =============================== */
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      background-color: #0f0f0f;
      color: #eaeaea;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    /* ===============================
       Header
       =============================== */
    header {
      background-color: #141414;
      border-bottom: 1px solid #222;
    }

    .nav-container {
      max-width: 1100px;
      margin: 0 auto;
      padding: 1rem 1.5rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .logo {
      font-size: 1.2rem;
      font-weight: 600;
      letter-spacing: 0.5px;
    }

    nav ul {
      list-style: none;
      display: flex;
      gap: 1.5rem;
      align-items: center;
    }

    nav li {
      position: relative;
    }

    nav a {
      font-size: 0.95rem;
      padding: 0.4rem 0.6rem;
      transition: color 0.2s ease;
    }

    nav a:hover,
    nav a:focus {
      color: #f0c674;
      outline: none;
    }

    /* ===============================
       Dropdown Menu
       =============================== */
    .dropdown {
      position: absolute;
      top: 130%;
      left: 0;
      min-width: 180px;
      background-color: #1a1a1a;
      border: 1px solid #2a2a2a;
      border-radius: 6px;
      padding: 0.5rem 0;
      opacity: 0;
      visibility: hidden;
      transform: translateY(-8px);
      transition:
        opacity 0.2s ease,
        transform 0.2s ease,
        visibility 0.2s;
      z-index: 100;
    }

    .dropdown a {
      display: block;
      padding: 0.6rem 1rem;
      font-size: 0.9rem;
      white-space: nowrap;
    }

    .dropdown a:hover {
      background-color: #242424;
    }

    /* Show dropdown on hover or focus */
    li:hover > .dropdown,
    li:focus-within > .dropdown {
      opacity: 1;
      visibility: visible;
      transform: translateY(0);
    }

    /* ===============================
       Main Content
       =============================== */
    main {
      flex: 1;
      max-width: 1100px;
      margin: 0 auto;
      padding: 3rem 1.5rem;
    }

    main h1 {
      font-size: 2rem;
      margin-bottom: 1rem;
    }

    main p {
      color: #cfcfcf;
      max-width: 600px;
      line-height: 1.6;
    }

    /* ===============================
       Footer
       =============================== */
    footer {
      background-color: #141414;
      border-top: 1px solid #222;
      padding: 1.5rem;
      text-align: center;
      font-size: 0.85rem;
      color: #888;
    }
  </style>
</head>
<body>

  <!-- Header -->
  <header>
    <div class="nav-container">
      <div class="logo">Ruben Villasmil</div>

      <nav>
        <ul>
          <li><a href="#">Home</a></li>
          <li><a href="#contact">Contact</a></li>

          <li>
            <a href="#" aria-haspopup="true">Projects</a>
            <div class="dropdown" role="menu">
              <a href="#" role="menuitem">Other Websites</a>
              <a href="#" role="menuitem">YouTube</a>
              <a href="assets/cv.pdf" download role="menuitem">CV Download</a>
            </div>
          </li>
        </ul>
      </nav>
    </div>
  </header>

  <!-- Main -->
  <main>
    <h1>Welcome</h1>
    <p>
      This is the homepage. Use the navigation above to explore projects,
      access external platforms, or download the CV.
    </p>
  </main>

  <!-- Footer -->
  <footer>
    © 2026 Ruben Villasmil. All rights reserved.
  </footer>

</body>
</html>
