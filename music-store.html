<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Classical Music Store — Vinyl Collection</title>
  <meta name="description" content="Premium classical music on vinyl. Experience timeless compositions with our interactive player." />
  <link rel="stylesheet" href="music-store-styles.css">
</head>
<body>
  <header class="music-header">
    <div class="header-container">
      <h1 class="store-title">Classical Vinyl Store</h1>
      <p class="store-subtitle">Timeless compositions, timeless format</p>
    </div>
  </header>

  <main>
    <section class="catalog-section">
      <div class="container">
        <h2 class="section-title">Our Collection</h2>
        <div class="albums-grid" id="albums-grid">
          <!-- Albums will be dynamically generated -->
        </div>
      </div>
    </section>
  </main>

  <footer class="music-footer">
    <div class="container">
      <p>&copy; <span id="year"></span> Classical Vinyl Store. All rights reserved.</p>
    </div>
  </footer>

  <script src="music-player.js"></script>
</body>
</html>
